id = "builder-jdk25-ssh"

[[check]]
image = "debian13-jdk25-builder"
command = ["python3", "-c", "import cryptography, jmespath; print('ansible extras ok')"]
expect = "ansible extras ok"
id = "builder-jdk25-ansible-extras"

# web servers / proxies
[[check]]
